# Example config. Token0/1, decimals, fee_tier, tick_spacing are filled in by
# scripts/prepare_pool_config.py — leave as placeholders if hand-editing the
# pool address only.

pools:
  - address: "0xb2cc224c1c9feE385f8ad6a55b4d94E92359DC59"  # Aerodrome ETH/USDC CL on Base — replace with target pool
    symbol: "ETH/USDC"
    token0: "0x0000000000000000000000000000000000000000"
    token1: "0x0000000000000000000000000000000000000000"
    decimals0: 18
    decimals1: 6
    fee_tier: 500
    tick_spacing: 10
    range:
      type: "tick_width"
      width_ticks: 200
    position_size_usd: 10000
    tx_cost_usd: 0.01
    slippage_bps: 200

backtest:
  start_block: 40000000
  end_block: 40100000

prediction:
  horizon_blocks: 300       # ~10 min on Base (2s blocks)
  noise_sigma: 0.20         # std dev of multiplicative noise on oracle vol
  vol_bucket_blocks: 30     # price sampled every 30 blocks; 300/30 = 10 samples → 9 returns

strategy:
  type: "hysteresis_with_holding"
  params:
    threshold_high: 0.015
    threshold_low: 0.001
    min_holding_blocks: 50

# Smaller sweep grid for smoke-testing — tune up for real runs.
sweep:
  grid:
    "prediction.noise_sigma": [0.0, 0.2]
    "prediction.horizon_blocks": [300, 900]
    "strategy.params.threshold_high": [0.010, 0.025]

seed: 42
